name: GKFXL OS Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify package metadata
        run: npm --version

      - name: Run tests
        run: npm test

      - name: Run benchmark
        run: npm run benchmark
